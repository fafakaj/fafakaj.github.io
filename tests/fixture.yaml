projects:
- slug: floodvalue
  title: FloodValue — карта затоплений по радарным снимкам
  year: 2026
  kind: Хакатон
  date: 2026-09-27
  featured: true
  event: Космохакатон 2026, 25–27 сентября, финал, 3 место
  summary: По радарным снимкам Sentinel-1 модель строит вероятностную карту воды,
    оценивает ожидаемый ущерб объектам и планирует дополнительную съёмку в рамках
    бюджета.
  stack:
  - Python
  - PyTorch
  - U-Net
  - scikit-learn
  - rasterio
  - FastAPI
  - React
  - MapLibre
  task: 'Помочь инфраструктурному оператору при наводнении: понять, где вода, какой
    ущерб ожидается у объектов и какую дополнительную спутниковую съёмку заказать
    при ограниченном бюджете.'
  solution: Компактная U-Net (ансамбль из 5 моделей) сегментирует воду на снимках
    Sentinel-1 из открытого датасета Sen1Floods11. Вероятности откалиброваны методом
    Платта. По карте воды считается ожидаемый ущерб 10 объектов, а три стратегии выбирают
    дополнительную съёмку в пределах бюджета. Результат показан на интерактивной карте.
  result: Финал хакатона, 3 место. На отложенной тестовой выборке IoU модели 0,725
    против 0,677 у порогового бейзлайна.
  thumb: static/img/kosmo-thumb.jpg
  images:
  - src: static/img/kosmo.jpg
    caption: Интерфейс с наблюдениями на карте мира
  snippet:
    lang: bash
    code: 'make setup && make data && make split

      make train GPU=1   # U-Net, ансамбль из 5 seed

      make all CHIP=Sri-Lanka_713926 BUDGET=5000'
  resume: true
- slug: neftekod
  title: Рекомендации оператору установки гидроочистки
  year: 2026
  kind: Хакатон
  featured: false
  event: Нефтекод 2.0, 8–22 сентября 2026
  summary: Мультиагентная система по данным установки прогнозирует качество дизельного
    топлива и выдаёт оператору проверенную рекомендацию или обоснованный отказ.
  stack:
  - Python
  - pandas
  - NumPy
  - pytest
  task: По телеметрии установки и лабораторным анализам оценить качество товарного
    дизельного топлива (сера, T95, цетановое число, плотность) и предложить оператору
    безопасное управляющее воздействие.
  solution: 'Четыре детерминированных агента без LLM: качество, надёжность, оптимизация
    и оркестратор, который заново проверяет каждую рекомендацию по независимым источникам.
    Прогноз серы проверен бэктестом на истории. Если данных не хватает, система отказывается
    и объясняет причину.'
  result: Рекомендация выдаётся карточкой по семи блокам ТЗ и в JSON. Прогон детерминирован,
    проект покрыт 346 тестами.
  resume: true
