# Проект. Поля:
#   slug       — адрес страницы: /code/<slug>/
#   title, year, kind (например «Хакатон»), event — название хакатона, даты, результат
#   summary    — одна-две фразы для главной и резюме
#   stack      — список технологий
#   links      — список {label, url}
#   task, solution, result — кейс для страницы проекта и полного PDF
#   date       — дата окончания (ГГГГ-ММ-ДД), featured — показывать в «Финалах»
#   thumb      — маленькое превью (static/img/<файл>)
#   snippet    — {lang, code}: карточка с кодом во вкладке Code
#   images     — список {src: static/img/<файл>, caption}
#   resume     — true: проект попадает в короткое резюме
projects:
  - slug: post-digital-twin
    title: Цифровой двойник отделения Почты России
    year: 2026
    kind: Хакатон
    date: 2026-10-08
    featured: true
    event: Хакатон Почтатеха, 17 сентября — 8 октября 2026, финал, 5 место
    summary: >-
      Веб-редактор плана почтового отделения в 2D и 3D: инвентаризация оборудования,
      автоматические проверки и объяснимые рекомендации по планировке.
    stack: [TypeScript, React, Konva, Three.js, Fastify, Zod, Vitest, Playwright, Docker]
    task: >-
      Сделать цифровой двойник почтового отделения: план помещения с зонами и
      оборудованием, по которому можно провести инвентаризацию, найти нарушения
      и получить рекомендации по расстановке.
    solution: |-
      Редактор синтетического плана отделения с библиотекой оборудования, зонами и перегородками. Инвентаризация, 3D-вид и рекомендации работают на одной модели плана. Геометрию и площади считает код, а ассистент на LLM (Qwen, DeepSeek) объясняет результаты. Без ключа API ассистент считает сам.

      Справочник оборудования расширяется прямо в редакторе. Планы сохраняются в файл и открываются заново.
    result: >-
      Финал хакатона, 5 место. Сервис развёрнут в Yandex Cloud, сценарий проверки
      покрыт браузерными тестами Playwright.
    thumb: static/img/pochta-thumb.jpg
    images:
      - src: static/img/pochta.jpg
        caption: План демо-отделения с зонами, оборудованием и инвентаризацией
    snippet:
      lang: bash
      code: |-
        docker compose up --build -d
        # редактор: http://127.0.0.1:8080
        npm test && npm run typecheck && npm run test:e2e
    resume: true

  - slug: rlt-suppliers
    title: Подбор поставщиков для госзакупок
    year: 2026
    kind: Хакатон
    date: 2026-10-02
    featured: true
    event: RLT.Hack (Росэлторг), 1–2 октября 2026, финал, 5 место
    summary: >-
      Сервис подбирает поставщиков, производителей и дистрибьюторов под закупку
      заказчика и объясняет каждую рекомендацию с источником факта.
    stack: [Python, FastAPI, DuckDB, LightGBM, BM25, sentence-transformers, PostgreSQL, React, Docker]
    task: >-
      Для АИС госзакупок и Электронного магазина Санкт-Петербурга найти
      поставщиков под потребность заказчика: и тех, кто уже участвовал
      в госзакупках, и новых компаний из открытых источников.
    solution: >-
      Поиск по истории лотов (BM25 и эмбеддинги) и ранжирование LightGBM.
      Выдача разделена на два блока: «С опытом госзакупок» и «Новые из открытых
      источников». Карточки компаний обогащаются из открытых реестров ФНС,
      реестра МСП, ГИСП и реестра недобросовестных поставщиков. У каждого факта
      есть источник и дата.
    result: >-
      Финал хакатона, 5 место. На 604 452 лотах 2024–2025 годов победитель лота
      попадает в топ-10 выдачи в 55,7 % случаев (dev-выборка).
    thumb: static/img/rlt-thumb.jpg
    images:
      - src: static/img/rlt.jpg
        caption: Карточка поставщика с ролью, историей закупок и соответствием товару
    snippet:
      lang: bash
      code: |-
        make data PART=processed && make data PART=cache
        make demo          # UI, API и воркер: http://127.0.0.1:8000
        make eval EXP=<id> # оценка с bootstrap-интервалами
    resume: true

  - slug: floodvalue
    title: FloodValue — карта затоплений по радарным снимкам
    year: 2026
    kind: Хакатон
    date: 2026-09-27
    featured: true
    event: Космохакатон 2026, 25–27 сентября, финал, 3 место
    summary: >-
      По радарным снимкам Sentinel-1 модель строит вероятностную карту воды,
      оценивает ожидаемый ущерб объектам и планирует дополнительную съёмку в рамках бюджета.
    stack: [Python, PyTorch, U-Net, scikit-learn, rasterio, FastAPI, React, MapLibre]
    task: >-
      Помочь инфраструктурному оператору при наводнении: понять, где вода,
      какой ущерб ожидается у объектов и какую дополнительную спутниковую съёмку
      заказать при ограниченном бюджете.
    solution: >-
      Компактная U-Net (ансамбль из 5 моделей) сегментирует воду на снимках
      Sentinel-1 из открытого датасета Sen1Floods11. Вероятности откалиброваны
      методом Платта. По карте воды считается ожидаемый ущерб 10 объектов, а три
      стратегии выбирают дополнительную съёмку в пределах бюджета. Результат
      показан на интерактивной карте.
    result: >-
      Финал хакатона, 3 место. На отложенной тестовой выборке IoU модели 0,725
      против 0,677 у порогового бейзлайна.
    thumb: static/img/kosmo-thumb.jpg
    images:
      - src: static/img/kosmo.jpg
        caption: Интерфейс с наблюдениями на карте мира
    snippet:
      lang: bash
      code: |-
        make setup && make data && make split
        make train GPU=1   # U-Net, ансамбль из 5 seed
        make all CHIP=Sri-Lanka_713926 BUDGET=5000
    resume: true

  - slug: neftekod
    title: Рекомендации оператору установки гидроочистки
    year: 2026
    kind: Хакатон
    date: 2026-09-22
    featured: false
    event: Нефтекод 2.0, 8–22 сентября 2026
    summary: >-
      Мультиагентная система по данным установки прогнозирует качество дизельного
      топлива и выдаёт оператору проверенную рекомендацию или обоснованный отказ.
    stack: [Python, pandas, NumPy, pytest]
    task: >-
      По телеметрии установки и лабораторным анализам оценить качество товарного
      дизельного топлива (сера, T95, цетановое число, плотность) и предложить
      оператору безопасное управляющее воздействие.
    solution: >-
      Четыре детерминированных агента без LLM: качество, надёжность, оптимизация
      и оркестратор, который заново проверяет каждую рекомендацию по независимым
      источникам. Прогноз серы проверен бэктестом на истории. Если данных
      не хватает, система отказывается и объясняет причину.
    result: >-
      Рекомендация выдаётся карточкой по семи блокам ТЗ и в JSON. Прогон
      детерминирован, проект покрыт 346 тестами.
    snippet:
      lang: bash
      code: |-
        python scripts/prepare_data.py       # ЛИМС/ПАК → таблицы
        python scripts/evaluate_forecast.py  # бэктест прогноза серы
        python scripts/run_all_scenarios.py  # 4 сценария → рекомендации
        pytest -q                            # 346 passed
    resume: true

  - slug: tender-hack
    title: Агрегатор цен с маркетплейсов
    year: 2026
    kind: Хакатон
    date: 2026-05-25
    featured: false
    event: Tender Hack, 22–25 мая 2026
    summary: >-
      Сервис параллельно ищет цены на товар в Wildberries, Ozon, Яндекс Маркете
      и открытых источниках и сводит результаты в одну выдачу.
    stack: [Python, FastAPI, Playwright, Redis, SearXNG, sentence-transformers, React, Docker]
    links:
      - label: GitHub
        url: https://github.com/IR630/tender_hack
    task: >-
      Быстро собрать актуальные цены на товар из нескольких маркетплейсов
      и открытых источников для обоснования цены закупки.
    solution: >-
      FastAPI опрашивает источники параллельно: Wildberries, Ozon, Яндекс Маркет
      и четвёртый источник через метапоиск SearXNG. Для сайтов с защитой
      используется браузер Playwright, результаты кешируются в Redis.
      Похожие товары сопоставляются эмбеддингами rubert-tiny2.
    result: >-
      Рабочий прототип с React-интерфейсом и запуском через Docker.
    snippet:
      lang: bash
      code: |-
        cp .env.example .env
        cd docker && bash up.sh
        # API: http://127.0.0.1:8000/docs, UI: http://127.0.0.1:5173
    resume: true

