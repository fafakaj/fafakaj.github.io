{% extends "base.html" %}
{% block title %}Resume — {{ person.name }}{% endblock %}
{% block body %}
<main class="container">
  <h2 class="ctitle">Resume</h2>
  <div class="docs">
    {% for d in docs %}
    <figure class="doc">
      <a href="{{ root }}pdf/{{ d.file }}" class="sheet" target="_blank" rel="noopener" aria-label="Open {{ d.label | lower }} PDF">
        {% if d.preview %}<img src="{{ root }}pdf/{{ d.preview }}" alt="" loading="lazy">{% else %}<span class="doc-blank">PDF</span>{% endif %}
      </a>
      <figcaption>
        <span class="doc-title">{{ d.label }}</span>
        <span class="doc-note">{{ d.note }}</span>
        <a href="{{ root }}pdf/{{ d.file }}" class="btn{% if loop.first %} btn-primary{% endif %}" download>
          <svg class="bicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Download PDF
        </a>
      </figcaption>
    </figure>
    {% endfor %}
  </div>
</main>
{% endblock %}
