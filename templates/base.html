<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ person.name }} — портфолио{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ person.role }}. {{ person.about }}{% endblock %}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site_url }}{{ path }}">
  <link rel="icon" href="{{ root }}static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
  <header id="headline">
    <h1><a href="{{ root }}">{{ person.name }}</a></h1>
    <p class="subtitle">{{ person.role }} @ <a href="{{ education[0].url }}">{{ education[0].university }}</a></p>
  </header>

  <nav id="menu" aria-label="Разделы">
    {% for item in menu %}
    <a href="{{ root }}{{ item.href }}"{% if item.id == active %} class="active" aria-current="page"{% endif %}>{{ item.label }}</a>
    {% endfor %}
  </nav>

  <main id="content">
    {% block content %}{% endblock %}
  </main>

  <footer id="footer">
    <p>{{ person.full_name }} · обновлено {{ updated }}</p>
  </footer>
  <script src="{{ root }}static/menu.js" defer></script>
</body>
</html>
