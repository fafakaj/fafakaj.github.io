# Проект. Поля:
#   slug       — адрес страницы: /projects/<slug>/
#   title, year, kind (например Hackathon), event — название хакатона, даты, результат
#   summary    — одна-две фразы для списка проектов и резюме
#   stack      — список технологий
#   links      — список {label, url}
#   task, solution, result — кейс для страницы проекта и полного PDF
#   thumb      — превью для списка проектов (static/img/<файл>)
#   images     — список {src: static/img/<файл>, caption}
#   resume     — true: проект попадает в короткое резюме
projects:
  - slug: post-digital-twin
    title: Digital twin of a Russian Post office
    year: 2026
    kind: Hackathon
    event: Pochtatech Hackathon, September 17 – October 8, 2026, final, 5th place
    summary: >-
      A 2D and 3D web editor for a post office floor plan: equipment inventory,
      automatic checks and explainable layout recommendations.
    stack: [TypeScript, React, Konva, Three.js, Fastify, Zod, Vitest, Playwright, Docker]
    task: >-
      Build a digital twin of a post office: a floor plan with zones and
      equipment that supports an inventory check, finds violations
      and gives recommendations on the layout.
    solution: |-
      An editor for a synthetic office plan with an equipment library, zones and partitions. The inventory, the 3D view and the recommendations all use one plan model. Code calculates geometry and areas, and an LLM assistant (Qwen, DeepSeek) explains the results. Without an API key, the assistant works on rules alone.

      Users can extend the equipment catalog directly in the editor. Plans are saved to a file and can be opened again.
    result: >-
      Hackathon final, 5th place. The service runs in Yandex Cloud, and the
      check scenario is covered by Playwright browser tests.
    thumb: static/img/pochta-thumb.jpg
    images:
      - src: static/img/pochta.jpg
        caption: Demo office plan with zones, equipment and inventory
    resume: true

  - slug: rlt-suppliers
    title: Supplier matching for public procurement
    year: 2026
    kind: Hackathon
    event: RLT.Hack (Roseltorg), October 1–2, 2026, final, 5th place
    summary: >-
      The service finds suppliers, manufacturers and distributors for a customer's
      purchase and explains each recommendation with the source of every fact.
    stack: [Python, FastAPI, DuckDB, LightGBM, BM25, sentence-transformers, PostgreSQL, React, Docker]
    task: >-
      For the Saint Petersburg public procurement system and its e-shop, find
      suppliers for a customer's need: both companies with public procurement
      experience and new companies from open sources.
    solution: >-
      Search over lot history (BM25 and embeddings) with LightGBM ranking.
      Results come in two blocks: "With procurement experience" and "New from
      open sources". Company cards are enriched from open registries: the Federal
      Tax Service, the SME registry, GISP and the registry of unreliable suppliers.
      Every fact has a source and a date.
    result: >-
      Hackathon final, 5th place. On 604,452 lots from 2024–2025, the lot winner
      is in the top 10 results in 55.7% of cases (dev set).
    thumb: static/img/rlt-thumb.jpg
    images:
      - src: static/img/rlt.jpg
        caption: Supplier card with role, procurement history and product match
    resume: true

  - slug: floodvalue
    title: FloodValue — flood maps from radar imagery
    year: 2026
    kind: Hackathon
    event: Cosmohackathon 2026, September 25–27, final, 3rd place
    summary: >-
      A model builds a probabilistic water map from Sentinel-1 radar images,
      estimates expected damage to assets and plans extra imaging within a budget.
    stack: [Python, PyTorch, U-Net, scikit-learn, rasterio, FastAPI, React, MapLibre]
    task: >-
      Help an infrastructure operator during a flood: find where the water is,
      estimate the expected damage to assets and choose which extra satellite
      images to order with a limited budget.
    solution: >-
      A compact U-Net (an ensemble of 5 models) segments water on Sentinel-1
      images from the open Sen1Floods11 dataset. Probabilities are calibrated
      with Platt scaling. The water map gives the expected damage for 10 assets,
      and three strategies choose extra imaging within the budget. The result
      is shown on an interactive map.
    result: >-
      Hackathon final, 3rd place. On a held-out test set, the model reaches
      IoU 0.725 against 0.677 for a threshold baseline.
    thumb: static/img/kosmo-thumb.jpg
    images:
      - src: static/img/kosmo.jpg
        caption: Interface with observations on the world map
    resume: true

  - slug: neftekod
    title: Recommendations for a hydrotreating unit operator
    year: 2026
    kind: Hackathon
    event: Neftekod 2.0, September 8–22, 2026
    summary: >-
      A multi-agent system uses unit data to forecast diesel fuel quality and gives
      the operator a verified recommendation or a reasoned refusal.
    stack: [Python, pandas, NumPy, pytest]
    task: >-
      Use unit telemetry and lab analyses to estimate the quality of commercial
      diesel fuel (sulfur, T95, cetane number, density) and suggest a safe
      control action to the operator.
    solution: >-
      Four deterministic agents without an LLM: quality, reliability, optimization
      and an orchestrator that re-checks every recommendation against independent
      sources. The sulfur forecast is validated with a backtest on history. When
      data is missing, the system refuses and explains why.
    result: >-
      The recommendation comes as a card with the seven blocks from the brief and as
      JSON. Runs are deterministic, and the project has 346 tests.
    resume: true

  - slug: tender-hack
    title: Marketplace price aggregator
    year: 2026
    kind: Hackathon
    event: Tender Hack, May 22–25, 2026
    summary: >-
      The service searches for product prices on Wildberries, Ozon, Yandex Market
      and open sources in parallel and merges the results into one list.
    stack: [Python, FastAPI, Playwright, Redis, SearXNG, sentence-transformers, React, Docker]
    links:
      - label: GitHub
        url: https://github.com/IR630/tender_hack
    task: >-
      Quickly collect current product prices from several marketplaces
      and open sources to justify a purchase price.
    solution: >-
      FastAPI queries the sources in parallel: Wildberries, Ozon, Yandex Market
      and a fourth source through the SearXNG metasearch engine. Protected sites
      are opened with a Playwright browser, and results are cached in Redis.
      Similar products are matched with rubert-tiny2 embeddings.
    result: >-
      A working prototype with a React interface that runs in Docker.
    resume: true

