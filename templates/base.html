<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ person.name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ person.role }}. {{ person.about }}{% endblock %}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site_url }}{{ path }}">
  {% if person.photo %}<meta property="og:image" content="{{ site_url }}{{ person.photo }}">{% endif %}
  <link rel="icon" href="{{ root }}static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
{% block body %}{% endblock %}
<script src="{{ root }}static/site.js" defer></script>
</body>
</html>
