{% extends "base.html" %}
{% block body %}
<main id="dhead" class="container">
  <div class="row{% if not person.photo %} nophoto{% endif %}">
    {% if person.photo %}
    <div id="dpic"><img src="{{ root }}{{ person.photo }}" class="ppic" alt="{{ person.name }}"></div>
    {% endif %}
    <div id="ddesc">
      <h1>{{ person.name }}</h1>
      <h2>{{ person.title }}</h2>
    </div>
  </div>
</main>
{% endblock %}
